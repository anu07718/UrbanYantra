# Multi-city India pilot — aligned with hackathon deep-build spec (Section 2)
# bbox: [min_lon, min_lat, max_lon, max_lat] WGS84
# station coords: CPCB/IMD reference for offline calibration (Phase 4)

defaults:
  country: India
  crs: EPSG:4326
  target_resolution_m: 10
  data_mode: synthetic
  date_range:
    start: "2024-03-01"
    end: "2024-06-30"
    composite_method: median
  landsat:
    collection: LANDSAT/LC08/C02/T1_L2
    lst_band: ST_B10
    scale_factor: 0.00341802
    offset: 149.0
    cloud_cover_max: 30
  sentinel2:
    collection: COPERNICUS/S2_SR_HARMONIZED
    cloud_probability_max: 40
  worldcover:
    collection: ESA/WorldCover/v200
    year: 2021
  era5_land:
    collection: ECMWF/ERA5_LAND/HOURLY
    variables:
      - temperature_2m
      - dewpoint_temperature_2m
      - u_component_of_wind_10m
      - v_component_of_wind_10m
      - surface_solar_radiation_downwards
  ghsl:
    building_height: JRC/GHSL/P2016/BUILD_HEIGHT
    population: JRC/GHSL/P2016/POP
  hotspot:
    moderate_delta_c: 2.0
    severe_delta_c: 4.0
    gi_star_p_threshold: 0.05
    gi_star_kernel: 5
  spatial_cv:
    tile_size_deg: 0.04
    holdout_fraction: 0.2
  scenarios:
    urban_greening:
      canopy_increase_pct: 25
      shade_factor: 0.15
    cool_roof:
      albedo_increase: 0.25
      roof_fraction: 0.35
    blue_infrastructure:
      water_fraction_increase: 0.05
      evap_cooling_c: 1.5
  # TODO: source actual ₹/sqm intervention costs from municipal data
  intervention_costs_inr_per_sqm:
    urban_greening: 1200
    cool_roof: 450
    blue_infrastructure: 3500

cities:
  Mumbai:
    city_name: Mumbai
    bbox: [72.75, 18.89, 72.98, 19.27]
    timezone: Asia/Kolkata
    stations:
      - {name: Bandra, lon: 72.8347, lat: 19.0544}
      - {name: Colaba, lon: 72.8177, lat: 18.9067}
    output_dir: outputs/mumbai

  Delhi_NCR:
    city_name: Delhi NCR
    bbox: [76.84, 28.40, 77.35, 28.88]
    timezone: Asia/Kolkata
    stations:
      - {name: Anand Vihar, lon: 77.3163, lat: 28.6469}
      - {name: RK Puram, lon: 77.1726, lat: 28.5649}
    output_dir: outputs/delhi_ncr

  Bengaluru:
    city_name: Bengaluru
    bbox: [77.46, 12.84, 77.78, 13.14]
    timezone: Asia/Kolkata
    stations:
      - {name: City Railway Station, lon: 77.5667, lat: 12.9767}
      - {name: Peenya, lon: 77.5250, lat: 13.0350}
    output_dir: outputs/bengaluru

  Ahmedabad:
    city_name: Ahmedabad
    bbox: [72.48, 22.96, 72.68, 23.12]
    timezone: Asia/Kolkata
    stations:
      - {name: Maninagar, lon: 72.6012, lat: 22.9989}
      - {name: Satellite, lon: 72.5286, lat: 23.0225}
    output_dir: outputs/ahmedabad

  # Legacy pilot — kept for backward compatibility
  Pune:
    city_name: Pune
    bbox: [73.80, 18.48, 73.92, 18.58]
    timezone: Asia/Kolkata
    stations:
      - {name: Karve Road, lon: 73.8077, lat: 18.5018}
    output_dir: outputs/pune
