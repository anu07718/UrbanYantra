# Cloud-friendly dataset sources — works on Render, CI, teammates' machines.
#
# data_mode: local  →  GHSL + ERA5 from Google Drive cache; Landsat/S2/WorldCover still from GEE
# data_mode: gee    →  All satellite from GEE; GHSL/ERA5 from Drive if urban_dataset_folder set
## ── YOUR GOOGLE DRIVE (Urban Dataset) ─────────────────────────────────────
# Share link: https://drive.google.com/drive/folders/1pM9UKiI03lm_4XhnSwmcAp8at1pz8REU
# Contains: ERA5 UTCI zip, GHSL Built-S (7 India zips), GHSL SMOD (7 India zips), etc.
# Pipeline auto-downloads once → data/cache/urban_dataset/
# GHSL: picks the zip/tile whose bounds overlap your city bbox (Mumbai, Pune, …)

remote_data:
  cache_dir: data/cache

  # Master folder — sync entire Urban Dataset tree (recommended)
  urban_dataset_folder:
    google_drive_folder_url: "https://drive.google.com/drive/folders/1pM9UKiI03lm_4XhnSwmcAp8at1pz8REU?usp=drive_link"
    google_drive_folder_id: "1pM9UKiI03lm_4XhnSwmcAp8at1pz8REU"

  # D-07 Kaggle UHI — bundled in data/benchmarks/ (no Drive needed)
  kaggle_uhi_csv:
    filename: urban_heat_island_dataset.csv

  # D-09 EY Challenge NYC labels — bundled in data/benchmarks/
  ey_uhi_training_csv:
    filename: Training_data_uhi_index_2025-02-18.csv

  # D-03 ERA5 UTCI — extracted from urban_dataset_folder after sync (ECMWF_utci_*.nc)
  era5_utci_dir:
    dirname: era5_utci
    # After folder sync, .nc files are found under data/cache/urban_dataset/

  # D-04 GHSL — resolved automatically from urban_dataset_folder (7 zips per layer)
  ghsl_built_s:
    layer: BUILT_S
  ghsl_smod:
    layer: SMOD
  ghsl_built_h:
    layer: BUILT_H
