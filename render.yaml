# UrbanCool — split deployment
# Frontend: Vercel (Next.js)
# Backend:  Render (FastAPI + rasterio + xgboost + full geo stack)

services:
  - type: web
    name: urbancool-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: OPENROUTER_API_KEY
        sync: false
